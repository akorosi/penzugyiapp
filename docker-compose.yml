# Helyi fejlesztői környezet: Flask API + PostgreSQL (az Aurora DSQL helyi
# megfelelője). Az AWS-es telepítést a Terraform végzi (lásd infra/).
services:
  db:
    image: postgres:16-alpine
    container_name: penzugy_db
    environment:
      POSTGRES_USER: penzugy
      POSTGRES_PASSWORD: penzugy
      POSTGRES_DB: penzugyek
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penzugy -d penzugyek"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: penzugy_app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://penzugy:penzugy@db:5432/penzugyek
      # Helyben nincs belépés (Cognito csak AWS-en): minden adat ehhez a
      # felhasználóhoz tartozik.
      - AUTH_MODE=none
      - DEV_USER_EMAIL=hundjmada@gmail.com
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
